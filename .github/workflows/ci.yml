name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build and test
        env:
          # A missing ffmpeg or ffprobe fails the end-to-end transcode test instead of skipping it.
          REQUIRE_FFMPEG: "true"
          # A missing Google Chrome fails the playback test instead of skipping it. The runner already has
          # Chrome, so Playwright must not download its own browsers (the bundled Chromium has no H.264 anyway).
          REQUIRE_BROWSER: "true"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: ./mvnw -B verify

  compose-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start Postgres, Kafka and the object store
        run: docker compose up -d --wait
      - name: Package
        run: ./mvnw -B -DskipTests package
      - name: Boot the application and check it
        run: |
          java --enable-preview -jar target/videostream-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/videos || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || { echo "GET /api/videos returned $code"; exit 1; }
          topics=$(docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list)
          echo "$topics"
          for t in video.uploaded video-metadata; do
            echo "$topics" | grep -qx "$t" || { echo "missing topic $t"; exit 1; }
          done
      - name: Logs
        if: always()
        run: |
          echo "--- application log"; cat app.log || true
          echo "--- compose logs"; docker compose logs || true
      - name: Tear down
        if: always()
        run: docker compose down -v
