spring.application.name=streaming-event-kafka

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/videostream}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

videostream.kafka.topics.replicas=${KAFKA_TOPIC_REPLICAS:1}
videostream.kafka.topics.video-uploaded-partitions=10
videostream.kafka.topics.video-metadata-partitions=5

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Explicit: the Spring Cloud Stream Kafka binder on the classpath otherwise makes the shared producer use byte[] serializers.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# The outbox relay's guarantee rests on these. They are the Kafka 3.x defaults, stated so they stay visible.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Delivery timeout stays above videostream.outbox.send-timeout (PT10S).
spring.kafka.producer.properties.delivery.timeout.ms=30000

# Transactional outbox: the upload commits an outbox row with the state change; the relay publishes it.
videostream.outbox.relay-enabled=true
videostream.outbox.poll-interval=PT0.5S
videostream.outbox.batch-size=50
videostream.outbox.send-timeout=PT10S

# Object store (S3 API). Credentials are local defaults only; set them in any deployment.
videostream.storage.endpoint=${S3_ENDPOINT:http://localhost:8333}
videostream.storage.region=${S3_REGION:us-east-1}
videostream.storage.bucket=${S3_BUCKET:videostream}
videostream.storage.access-key=${S3_ACCESS_KEY:local-access-key}
videostream.storage.secret-key=${S3_SECRET_KEY:local-secret-key}
videostream.storage.create-bucket=true
# An upload writes its object before the row commits; the grace period must stay much longer than a request.
videostream.storage.orphan-grace=PT1H
videostream.storage.cleanup-interval=PT10M

spring.servlet.multipart.max-file-size=${UPLOAD_MAX_SIZE:512MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_SIZE:512MB}

# FFmpeg transcoding (needs the ffmpeg binary on the host). The consumer pauses its partition while a job runs,
# so a job may take far longer than max-poll-interval.
videostream.transcode.enabled=true
videostream.transcode.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
videostream.transcode.timeout=PT30M
videostream.transcode.segment-seconds=6
videostream.transcode.concurrency=1
videostream.transcode.max-poll-interval=PT5M
# A transcode claim expires unless its job renews it (every lease/3), so a worker that died mid-job is detected
# after at most one lease. It is short because it is renewed; it must stay far above the clock skew between hosts.
videostream.transcode.lease=PT60S
videostream.transcode.renditions[0].name=720p
videostream.transcode.renditions[0].height=720
videostream.transcode.renditions[0].video-kbps=2800
videostream.transcode.renditions[0].audio-kbps=128
videostream.transcode.renditions[1].name=360p
videostream.transcode.renditions[1].height=360
videostream.transcode.renditions[1].video-kbps=800
videostream.transcode.renditions[1].audio-kbps=96
