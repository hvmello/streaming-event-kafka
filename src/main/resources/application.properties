spring.application.name=streaming-event-kafka

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/videostream}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

videostream.kafka.topics.replicas=${KAFKA_TOPIC_REPLICAS:1}
videostream.kafka.topics.video-uploads-partitions=10
videostream.kafka.topics.transcoded-videos-partitions=20
videostream.kafka.topics.video-metadata-partitions=5
