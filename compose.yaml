# Local development stack: Postgres, Kafka and an S3-compatible object store for the application running on the host.
# Usage: docker compose up -d --wait
# Overrides: put values in a git-ignored .env file or export them. Kafka always uses host port 9092.
services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: videostream
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d videostream"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object store (S3 API on port 8333). Credentials come from the environment variables below, which
  # SeaweedFS reads only when no s3.json is mounted; the defaults are for local use only.
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command: ["server", "-s3", "-dir=/data", "-volume.max=0", "-master.volumeSizeLimitMB=1024"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-local-access-key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-local-secret-key}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
  seaweedfs-data:
